[project]
name = "metadata-scrubber"
version = "0.1.0"
description = "Offline CLI tool to inspect and strip hidden metadata (EXIF/GPS/author info) from images, PDFs, and Office documents."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "reactivheat" }
]
keywords = ["privacy", "metadata", "exif", "cybersecurity", "cli", "offline"]

dependencies = [
    "click>=8.1",
    "Pillow>=10.0",
    "piexif>=1.1.3",
    "pypdf>=4.0",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "folium>=0.16",       # optional visualize feature — consider making this an [extras] group later
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]

[project.scripts]
metascrub = "metascrub.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/metascrub"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
